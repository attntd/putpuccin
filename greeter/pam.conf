#%PAM-1.0
# Account restrictions apply before either authentication method.
auth       requisite                    pam_nologin.so
auth       requisite                    pam_shells.so
auth       requisite                    pam_faillock.so preauth
# Retry availability/device failures once inside this same PAM transaction.
# A mismatch skips retry and its error markers; account guards above still apply.
auth       [success=done authinfo_unavail=ignore default=3] pam_fprintd.so max-tries=1 timeout=4
auth       optional                     pam_echo.so GREETER_FINGERPRINT_ERROR
auth       [success=done authinfo_unavail=ignore default=1] pam_fprintd.so max-tries=1 timeout=4
auth       optional                     pam_echo.so GREETER_FINGERPRINT_ERROR
# Cancellation here must stop before system-auth can count an unanswered password.
# Success only continues the stack; this module never authenticates the user.
auth       [success=ignore default=die]  /usr/local/share/quickshell-greeter/integrations/GreeterNative/pam_greeter_gate.so
auth       include                      system-auth

account    include                      system-login
password   include                      system-login
session    include                      system-login
