# Independent emergency UI. No external images, commands, animations or grace.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam:enabled = true
    pam:module = system-auth
    fingerprint:enabled = false
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(1e1e2eff)
}

label {
    monitor =
    text = Awaryjna blokada sesji
    color = rgba(cdd6f4ff)
    font_size = 20
    font_family = sans-serif
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    inner_color = rgba(1e1e2eff)
    outer_color = rgba(b4befeff)
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    font_color = rgba(cdd6f4ff)
    font_family = sans-serif
    placeholder_text = Hasło
    fail_text = Uwierzytelnienie nieudane
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}
